# Stack de la aplicacion. Las variables salen de .env (ver .env.example).
#
# En AWS, contra el RDS:
#   docker compose --env-file .env up --build -d
#
# En local, agregando una base de datos en contenedor:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
#
services:
  ms-auth:
    build: ./ms-auth
    image: exp1/ms-auth:3.0.0
    container_name: ms-auth
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:9000}
      OIDC_AUDIENCIA: ${OIDC_AUDIENCIA:-exp1-api}
      OIDC_RUTA_LLAVE: /app/llaves/jwk.json
      # Registro de usuarios en el tenant a traves de Microsoft Graph
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_DOMINIO: ${ENTRA_DOMINIO:-}
      GRAPH_ROL_USER_ID: ${GRAPH_ROL_USER_ID:-}
      GRAPH_SP_APLICACION: ${GRAPH_SP_APLICACION:-}
    volumes:
      # La llave RSA debe sobrevivir a los reinicios: si cambia, los tokens ya
      # emitidos y el JWKS cacheado por AWS API Gateway dejan de coincidir.
      - llaves_auth:/app/llaves

  ms-productos:
    build: ./ms-productos
    image: exp1/ms-productos:3.0.0
    container_name: ms-productos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PUERTO: ${DB_PUERTO:-3306}
      DB_NOMBRE: ${DB_NOMBRE:-pedidos360}
      DB_USUARIO: ${DB_USUARIO:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
      SEGURIDAD_EMISORES: ${SEGURIDAD_EMISORES:-http://localhost:9000}
      SEGURIDAD_AUDIENCIAS: ${SEGURIDAD_AUDIENCIAS:-}
      SEGURIDAD_ORIGENES_CORS: ${SEGURIDAD_ORIGENES_CORS:-http://localhost:4200}
      # Exige que la peticion venga del API Gateway. Vacio lo desactiva.
      SEGURIDAD_SECRETO_GATEWAY: ${SEGURIDAD_SECRETO_GATEWAY:-}

  ms-pedidos:
    build: ./ms-pedidos
    image: exp1/ms-pedidos:3.0.0
    container_name: ms-pedidos
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - ms-productos
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PUERTO: ${DB_PUERTO:-3306}
      DB_NOMBRE: ${DB_NOMBRE:-pedidos360}
      DB_USUARIO: ${DB_USUARIO:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
      SEGURIDAD_EMISORES: ${SEGURIDAD_EMISORES:-http://localhost:9000}
      SEGURIDAD_AUDIENCIAS: ${SEGURIDAD_AUDIENCIAS:-}
      SEGURIDAD_ORIGENES_CORS: ${SEGURIDAD_ORIGENES_CORS:-http://localhost:4200}
      # Exige que la peticion venga del API Gateway. Vacio lo desactiva.
      SEGURIDAD_SECRETO_GATEWAY: ${SEGURIDAD_SECRETO_GATEWAY:-}
      PRODUCTOS_URL: http://ms-productos:8081

  # El frontend vive en su propio repositorio:
  #   https://github.com/1samadhi/cloud-exp1-front-angular
  # Se construye alli y aqui solo se ejecuta la imagen resultante.
  # Ver scripts/desplegar-en-ec2.sh, que clona ambos repositorios.
  front-angular:
    image: exp1/front-angular:6.0.0
    container_name: front-angular
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - ms-auth
      - ms-productos
      - ms-pedidos

volumes:
  llaves_auth:

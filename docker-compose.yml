# Stack completo. Las variables salen de .env (ver .env.example).
#
#   docker compose --env-file .env up --build -d
#
services:
  # Base de datos local para desarrollo. En AWS este servicio no se levanta:
  # DB_HOST apunta al endpoint del RDS y el resto de la configuracion es igual.
  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NOMBRE:-pedidos360}
      MYSQL_USER: ${DB_USUARIO:-pedidos360}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cambiar}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cambiar}
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  ms-auth:
    build: ./ms-auth
    image: exp1/ms-auth:3.0.0
    container_name: ms-auth
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:9000}
      OIDC_AUDIENCIA: ${OIDC_AUDIENCIA:-exp1-api}
      OIDC_RUTA_LLAVE: /app/llaves/jwk.json
    volumes:
      # La llave RSA debe sobrevivir a los reinicios: si cambia, los tokens ya
      # emitidos y el JWKS cacheado por AWS API Gateway dejan de coincidir.
      - llaves_auth:/app/llaves

  ms-productos:
    build: ./ms-productos
    image: exp1/ms-productos:3.0.0
    container_name: ms-productos
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PUERTO: ${DB_PUERTO:-3306}
      DB_NOMBRE: ${DB_NOMBRE:-pedidos360}
      DB_USUARIO: ${DB_USUARIO:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
      SEGURIDAD_EMISORES: ${SEGURIDAD_EMISORES:-http://localhost:9000}
      SEGURIDAD_AUDIENCIAS: ${SEGURIDAD_AUDIENCIAS:-}
      SEGURIDAD_ORIGENES_CORS: ${SEGURIDAD_ORIGENES_CORS:-http://localhost:5173}

  ms-pedidos:
    build: ./ms-pedidos
    image: exp1/ms-pedidos:3.0.0
    container_name: ms-pedidos
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      ms-productos:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PUERTO: ${DB_PUERTO:-3306}
      DB_NOMBRE: ${DB_NOMBRE:-pedidos360}
      DB_USUARIO: ${DB_USUARIO:-pedidos360}
      DB_PASSWORD: ${DB_PASSWORD:-cambiar}
      SEGURIDAD_EMISORES: ${SEGURIDAD_EMISORES:-http://localhost:9000}
      SEGURIDAD_AUDIENCIAS: ${SEGURIDAD_AUDIENCIAS:-}
      SEGURIDAD_ORIGENES_CORS: ${SEGURIDAD_ORIGENES_CORS:-http://localhost:5173}
      PRODUCTOS_URL: http://ms-productos:8081

  front-end:
    build:
      context: ./front-end
      args:
        # Vite incrusta estas variables en el bundle durante el build
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-}
        VITE_ENTRA_SCOPE_API: ${VITE_ENTRA_SCOPE_API:-}
        VITE_API_PRODUCTOS: ${VITE_API_PRODUCTOS:-http://localhost:8081}
        VITE_API_PEDIDOS: ${VITE_API_PEDIDOS:-http://localhost:8082}
        VITE_API_AUTH: ${VITE_API_AUTH:-http://localhost:9000}
    image: exp1/front-end:3.0.0
    container_name: front-end
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - ms-auth
      - ms-productos
      - ms-pedidos

volumes:
  llaves_auth:
  datos_mysql:

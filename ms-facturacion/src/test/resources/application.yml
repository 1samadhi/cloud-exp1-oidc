spring:
  datasource:
    url: jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false

seguridad:
  emisores: https://login.microsoftonline.com/tenant-de-prueba/v2.0
  audiencias: ""
  origenes-cors: http://localhost:4200
  secreto-gateway: ""

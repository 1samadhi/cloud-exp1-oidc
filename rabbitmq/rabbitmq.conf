# Configuracion comun a los dos nodos del cluster RabbitMQ.
#
# Basada en la guia 2.3.1 "RabbitMQ Cluster con Docker Compose", con dos
# correcciones: la guia carga un definitions.json que no existe y usa
# queue_master_location = all, que no es un valor valido. Con cualquiera de
# las dos el nodo no arranca.

# Formacion del cluster: cada nodo conoce la lista completa y se une al
# que ya este corriendo. El nodo 2 espera a que el 1 este sano (ver compose).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Sin esto el nodo 1 pasa ~2,5 minutos buscando al 2 (que todavia no
# arranca) antes de seguir solo, y el healthcheck lo da por caido.
cluster_formation.discovery_retry_limit = 5
cluster_formation.discovery_retry_interval = 2000

# Las colas nuevas se crean en el nodo con menos lideres, repartiendo la carga
queue_leader_locator = balanced

# Las colas, exchanges y bindings NO se declaran aqui: los declara cada
# microservicio con sus beans de Spring (lo pide la pauta de la EP3).

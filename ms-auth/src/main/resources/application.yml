server:
  port: 9000

spring:
  application:
    name: ms-auth

oidc:
  # Debe coincidir exactamente con el claim "iss" que espera el autorizador de
  # AWS API Gateway. En local es el propio host; en AWS, la URL del stage.
  issuer: ${OIDC_ISSUER:http://localhost:9000}
  audiencia: ${OIDC_AUDIENCIA:exp1-api}
  vigencia-segundos: ${OIDC_VIGENCIA:3600}
  ruta-llave: ${OIDC_RUTA_LLAVE:./llaves/jwk.json}

# Registro de usuarios en el tenant a traves de Microsoft Graph.
# Sin estas variables el endpoint /auth/registro responde 503.
graph:
  tenant-id: ${GRAPH_TENANT_ID:}
  client-id: ${GRAPH_CLIENT_ID:}
  client-secret: ${GRAPH_CLIENT_SECRET:}
  dominio: ${GRAPH_DOMINIO:}
  rol-usuario-id: ${GRAPH_ROL_USER_ID:}
  sp-aplicacion: ${GRAPH_SP_APLICACION:}

# Identity Provider propio, retirado en favor de Entra ID. Sin usuarios
# declarados aqui, /auth/login rechaza cualquier credencial.
# Formato: usuario:clave:ROL[,ROL...][,otroUsuario:...]
idp:
  usuarios: ${IDP_USUARIOS:}

server:
  port: 9000

spring:
  application:
    name: ms-auth

# Registro de usuarios en el tenant a traves de Microsoft Graph.
# Sin estas variables el endpoint /auth/registro responde 503.
graph:
  tenant-id: ${GRAPH_TENANT_ID:}
  client-id: ${GRAPH_CLIENT_ID:}
  client-secret: ${GRAPH_CLIENT_SECRET:}
  dominio: ${GRAPH_DOMINIO:}
  rol-usuario-id: ${GRAPH_ROL_USER_ID:}
  sp-aplicacion: ${GRAPH_SP_APLICACION:}

# Exige que la peticion venga del API Gateway, que inyecta esta cabecera en
# cada integracion. Vacio desactiva la comprobacion, util en local.
seguridad:
  secreto-gateway: ${SEGURIDAD_SECRETO_GATEWAY:}

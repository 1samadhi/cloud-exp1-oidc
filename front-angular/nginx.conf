server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular resuelve el enrutado en el navegador: cualquier ruta desconocida
    # tiene que devolver index.html en lugar de 404, o recargar /catalogo
    # rompe la aplicacion.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
